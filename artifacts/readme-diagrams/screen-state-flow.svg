<svg xmlns="http://www.w3.org/2000/svg" width="900" height="960" role="img" aria-labelledby="title desc" viewBox="0 0 900 960">
<title id="title">Shared screen state and navigation flow</title><desc id="desc">Android and iOS run the same shared Compose screen. Step 1: the screen sends typed events to its presenter. Step 2: when data is needed, the presenter calls an interactor and DriverRepository, backed by FakeDriverRepositoryImpl, and receives the result. Step 3: the presenter updates UiState; the screen observes read-only StateFlow with collectAsState and recomposes. Navigation separately goes from presenter to router to a typed destination. The adaptive demo uses bundled rides without repository calls.</desc>
