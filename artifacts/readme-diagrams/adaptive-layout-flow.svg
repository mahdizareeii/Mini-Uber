<text x="725.0" y="890.0" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#087f8c" text-anchor="middle" dominant-baseline="central">Details</text>
<text x="725" y="951" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52646f" text-anchor="middle" dominant-baseline="central">Top and bottom</text>
<rect x="80" y="1010" width="740" height="64" rx="16" fill="#edf8f8" stroke="#a2c6ca" stroke-width="2"/>
<text x="450" y="1042" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087f8c" text-anchor="middle" dominant-baseline="central">Selection + scroll state stay outside pane placement</text>
<text x="450" y="1090" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#52646f" text-anchor="middle" dominant-baseline="central">Fold or resize → remeasure panes; retain the iOS Compose controller.</text>
